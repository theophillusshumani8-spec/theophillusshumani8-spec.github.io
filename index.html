    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo's Motorcycle & Generator Lab - Where Engines Meet Expertise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #0d1b2a;
            --secondary-dark: #1b263b;
            --accent-blue: #3da5d9;
            --light-blue: #2c8cb7;
            --light-bg: #f4f4f4;
            --white: #ffffff;
            --gray-light: #e8e8e8;
            --gray: #6b7280;
            --gray-dark: #374151;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: var(--light-bg);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        /* Header Styles */
        header {
            background-color: var(--primary-dark);
            color: var(--white);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .logo {
            height: 3rem;
            width: auto;
            border-radius: 50%;
        }
        
        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: bold;
        }
        
        .logo-text p {
            font-size: 0.875rem;
            color: var(--accent-blue);
        }
        
        nav {
            display: none;
        }
        
        .nav-desktop {
            display: flex;
            gap: 2rem;
        }
        
        .nav-desktop button {
            background: none;
            border: none;
            color: var(--white);
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .nav-desktop button:hover {
            color: var(--accent-blue);
        }
        
        .nav-desktop button.active {
            color: var(--accent-blue);
        }
        
        .mobile-menu-btn {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
        }
        
        .mobile-menu {
            display: none;
            padding-top: 1rem;
            padding-bottom: 1rem;
            border-top: 1px solid var(--secondary-dark);
        }
        
        .mobile-menu.active {
            display: block;
        }
        
        .mobile-menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: var(--white);
            font-weight: 600;
            padding: 0.5rem 0;
            cursor: pointer;
        }
        
        .mobile-menu button.active {
            color: var(--accent-blue);
        }
        
        /* Hero Section */
        .hero {
            background-color: var(--primary-dark);
            color: var(--white);
            padding: 4rem 0;
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark));
            opacity: 0.9;
        }
        
        .hero-content {
            position: relative;
            z-index: 10;
        }
        
        .hero-grid {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }
        
        .hero-text {
            text-align: center;
        }
        
        .hero-logo {
            margin: 0 auto 2rem;
            height: 12rem;
            width: auto;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .hero h1 {
            font-size: 2.25rem;
            font-weight: bold;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        
        .hero p {
            font-size: 1.25rem;
            color: #d1d5db;
            margin-bottom: 2rem;
        }
        
        .hero-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        
        .btn-primary {
            background-color: var(--accent-blue);
            color: var(--white);
            border: none;
        }
        
        .btn-primary:hover {
            background-color: var(--light-blue);
            transform: scale(1.05);
        }
        
        .btn-outline {
            background-color: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }
        
        .btn-outline:hover {
            background-color: var(--accent-blue);
            color: var(--white);
            transform: scale(1.05);
        }
        
        .hero-image {
            position: relative;
        }
        
        .hero-image img {
            width: 100%;
            height: auto;
            border-radius: 0.5rem;
        }
        
        .image-decoration {
            position: absolute;
            bottom: -1rem;
            right: -1rem;
            background-color: var(--accent-blue);
            color: var(--white);
            padding: 1rem;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        /* Section Styles */
        section {
            padding: 3rem 0;
        }
        
        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .section-title h2 {
            font-size: 1.875rem;
            font-weight: bold;
            color: var(--primary-dark);
            margin-bottom: 1rem;
        }
        
        .section-title p {
            color: var(--gray);
            max-width: 42rem;
            margin: 0 auto;
        }
        
        /* Trust Indicators */
        .trust-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        .trust-card {
            text-align: center;
            padding: 1.5rem;
            background-color: var(--light-bg);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .trust-icon {
            color: var(--accent-blue);
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .trust-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }
        
        .trust-card p {
            color: var(--gray);
        }
        
        /* Services Preview */
        .services-preview-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        .service-card {
            background-color: var(--white);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
        }
        
        .service-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .service-icon {
            color: var(--accent-blue);
            font-size: 2rem;
            margin-right: 0.75rem;
        }
        
        .service-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark);
        }
        
        .service-list {
            list-style: none;
        }
        
        .service-list li {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }
        
        .service-list i {
            color: var(--accent-blue);
            margin-top: 0.25rem;
            margin-right: 0.5rem;
            flex-shrink: 0;
        }
        
        .service-link {
            margin-top: 1.5rem;
            color: var(--accent-blue);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .service-link:hover {
            text-decoration: underline;
        }
        
        /* Testimonials */
        .testimonial-container {
            max-width: 64rem;
            margin: 0 auto;
        }
        
        .testimonial-card {
            background-color: var(--light-bg);
            border-radius: 0.5rem;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .testimonial-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .testimonial-avatar {
            width: 4rem;
            height: 4rem;
            border-radius: 50%;
            margin-right: 1rem;
        }
        
        .testimonial-info h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark);
        }
        
        .testimonial-stars {
            display: flex;
            color: #f59e0b;
        }
        
        .testimonial-text {
            font-size: 1.125rem;
            color: var(--gray-dark);
            font-style: italic;
        }
        
        .testimonial-indicators {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
            gap: 0.5rem;
        }
        
        .indicator {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 50%;
            background-color: #d1d5db;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .indicator.active {
            background-color: var(--accent-blue);
        }
        
        /* CTA Section */
        .cta-section {
            background-color: var(--primary-dark);
            color: var(--white);
            text-align: center;
            padding: 4rem 0;
        }
        
        .cta-section h2 {
            font-size: 1.875rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .cta-section p {
            font-size: 1.25rem;
            color: #d1d5db;
            margin-bottom: 2rem;
        }
        
        .cta-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            justify-content: center;
        }
        
        /* Footer */
        footer {
            background-color: var(--primary-dark);
            color: var(--white);
            padding-top: 3rem;
            padding-bottom: 1.5rem;
        }
        
        .footer-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .footer-logo {
            height: 4rem;
            width: auto;
            margin-bottom: 1rem;
        }
        
        .footer-about p {
            color: #d1d5db;
            margin-bottom: 1rem;
        }
        
        .social-links {
            display: flex;
            gap: 1rem;
        }
        
        .social-links a {
            color: #d1d5db;
            transition: color 0.3s;
        }
        
        .social-links a:hover {
            color: var(--accent-blue);
        }
        
        .footer-heading {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .footer-links {
            list-style: none;
        }
        
        .footer-links li {
            margin-bottom: 0.5rem;
        }
        
        .footer-links button {
            background: none;
            border: none;
            color: #d1d5db;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .footer-links button:hover {
            color: var(--accent-blue);
        }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            color: #d1d5db;
        }
        
        .contact-item {
            display: flex;
            align-items: flex-start;
        }
        
        .contact-icon {
            color: var(--accent-blue);
            margin-right: 0.5rem;
            margin-top: 0.125rem;
        }
        
        .newsletter-form {
            display: flex;
        }
        
        .newsletter-input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            background-color: var(--secondary-dark);
            color: var(--white);
            border: none;
            border-radius: 0.25rem 0 0 0.25rem;
            outline: none;
        }
        
        .newsletter-btn {
            background-color: var(--accent-blue);
            color: var(--white);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0 0.25rem 0.25rem 0;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .newsletter-btn:hover {
            background-color: var(--light-blue);
        }
        
        .footer-bottom {
            border-top: 1px solid var(--secondary-dark);
            padding-top: 1.5rem;
            text-align: center;
            color: #9ca3af;
        }
        
        /* WhatsApp Button */
        .whatsapp-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 50;
            background-color: #22c55e;
            color: var(--white);
            padding: 1rem;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            animation: bounce 2s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        
        .whatsapp-btn:hover {
            background-color: #16a34a;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        /* Services Page Styles */
        .services-hero {
            background-color: var(--primary-dark);
            color: var(--white);
            padding: 4rem 0;
            text-align: center;
        }
        
        .services-hero h1 {
            font-size: 2.25rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .services-hero p {
            font-size: 1.25rem;
            color: #d1d5db;
            max-width: 42rem;
            margin: 0 auto;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        .service-category {
            background-color: var(--white);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }
        
        .service-category-header {
            background-color: var(--secondary-dark);
            color: var(--white);
            padding: 1.5rem;
        }
        
        .service-category-header h2 {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .service-category-body {
            padding: 1.5rem;
        }
        
        .service-item {
            border-bottom: 1px solid var(--gray-light);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        
        .service-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .service-item-content {
            display: flex;
            align-items: flex-start;
        }
        
        .service-item-icon {
            background-color: var(--accent-blue);
            color: var(--white);
            border-radius: 50%;
            padding: 0.5rem;
            margin-right: 1rem;
            flex-shrink: 0;
        }
        
        .service-item-text h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 0.25rem;
        }
        
        .service-item-text p {
            color: var(--gray);
        }
        
        /* Pricing Section */
        .pricing-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        .pricing-category {
            background-color: var(--light-bg);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
        }
        
        .pricing-category h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
        }
        
        .pricing-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .pricing-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: var(--white);
            border-radius: 0.5rem;
        }
        
        .pricing-info h4 {
            font-weight: 500;
            color: var(--primary-dark);
        }
        
        .pricing-info p {
            font-size: 0.875rem;
            color: var(--gray);
        }
        
        .pricing-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-blue);
        }
        
        /* Gallery Section */
        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        
        .gallery-item {
            background-color: var(--white);
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .gallery-image {
            position: relative;
            overflow: hidden;
        }
        
        .gallery-image img {
            width: 100%;
            height: 12rem;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }
        
        .gallery-item:hover .gallery-overlay {
            background-color: rgba(0, 0, 0, 0.3);
        }
        
        .gallery-item:hover .gallery-image img {
            transform: scale(1.05);
        }
        
        .gallery-btn {
            background-color: var(--accent-blue);
            color: var(--white);
            padding: 0.5rem 1rem;
            border-radius: 1.5rem;
            border: none;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }
        
        .gallery-item:hover .gallery-btn {
            opacity: 1;
        }
        
        .gallery-caption {
            padding: 1rem;
        }
        
        .gallery-caption h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--primary-dark);
        }
        
        /* FAQ Section */
        .faq-container {
            max-width: 48rem;
            margin: 0 auto;
        }
        
        .faq-item {
            margin-bottom: 1rem;
        }
        
        .faq-question {
            width: 100%;
            text-align: left;
            padding: 1rem;
            background-color: var(--light-bg);
            border-radius: 0.5rem;
            border: none;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .faq-question:hover {
            background-color: var(--gray-light);
        }
        
        .faq-answer {
            padding: 1rem;
            background-color: var(--white);
            border-top: 1px solid var(--gray-light);
            color: var(--gray-dark);
        }
        
        .faq-icon {
            transition: transform 0.3s;
        }
        
        .faq-icon.rotate {
            transform: rotate(180deg);
        }
        
        /* About Page Styles */
        .about-hero {
            background-color: var(--primary-dark);
            color: var(--white);
            padding: 4rem 0;
            text-align: center;
        }
        
        .about-hero h1 {
            font-size: 2.25rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .about-hero p {
            font-size: 1.25rem;
            color: #d1d5db;
            max-width: 42rem;
            margin: 0 auto;
        }
        
        .story-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
        }
        
        .story-text h2 {
            font-size: 1.875rem;
            font-weight: bold;
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
        }
        
        .story-text p {
            color: var(--gray-dark);
            margin-bottom: 1.5rem;
        }
        
        .story-image {
            background-color: var(--white);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
        }
        
        .story-image img {
            width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .profile-card {
            background-color: var(--light-bg);
            padding: 1rem;
            border-radius: 0.5rem;
        }
        
        .profile-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }
        
        .profile-card p {
            color: var(--gray-dark);
            margin-bottom: 0.5rem;
        }
        
        .profile-card .small {
            font-size: 0.875rem;
            color: var(--gray);
        }
        
        .values-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        .value-card {
            text-align: center;
            padding: 1.5rem;
            background-color: var(--white);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .value-icon {
            color: var(--accent-blue);
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .value-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }
        
        .value-card p {
            color: var(--gray);
        }
        
        .team-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        .team-card {
            background-color: var(--light-bg);
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .team-card img {
            width: 100%;
            height: 12rem;
            object-fit: cover;
        }
        
        .team-info {
            padding: 1.5rem;
        }
        
        .team-info h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }
        
        .team-info .role {
            color: var(--accent-blue);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .team-info p {
            color: var(--gray);
        }
        
        /* Contact Page Styles */
        .contact-hero {
            background-color: var(--primary-dark);
            color: var(--white);
            padding: 4rem 0;
            text-align: center;
        }
